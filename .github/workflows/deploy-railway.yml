name: Deploy Railway

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_docker_push:
        description: 'Chỉ redeploy Railway (không build/push Docker)'
        required: false
        default: false
        type: boolean
      skip_migrate:
        description: 'Bỏ qua prisma migrate deploy'
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-railway-production
  cancel-in-progress: false

env:
  IMAGE: viejhaf/automationgenvideo-be:latest

jobs:
  build-and-push:
    name: Build & Push Docker Hub
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.skip_docker_push != 'true')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrate:
    name: Prisma migrate deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-and-push]
    if: |
      always() &&
      (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped') &&
      (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main') &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.skip_migrate != 'true')

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Validate DB secrets
        env:
          DIRECT_DATABASE_URL_SECRET: ${{ secrets.DIRECT_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Thiếu secret DATABASE_URL (connection string production)"
            exit 1
          fi
          if [ -n "$DIRECT_DATABASE_URL_SECRET" ]; then
            echo "DIRECT_DATABASE_URL=$DIRECT_DATABASE_URL_SECRET" >> "$GITHUB_ENV"
            echo "Dùng secret DIRECT_DATABASE_URL"
          else
            echo "DIRECT_DATABASE_URL=$DATABASE_URL" >> "$GITHUB_ENV"
            echo "Không có DIRECT_DATABASE_URL — fallback = DATABASE_URL"
          fi
          echo "DATABASE_URL OK"

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Prisma migrate deploy
        run: npx prisma migrate deploy

  redeploy:
    name: Redeploy Railway
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-and-push, migrate]
    if: |
      always() &&
      (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped') &&
      (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') &&
      (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main')

    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE_API: ${{ secrets.RAILWAY_SERVICE_API }}

    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Validate Railway secrets
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::Thiếu secret RAILWAY_TOKEN"
            exit 1
          fi
          echo "RAILWAY_TOKEN OK"

      - name: Redeploy API
        run: |
          if [ -z "$RAILWAY_SERVICE_API" ]; then
            echo "::error::Thiếu secret RAILWAY_SERVICE_API"
            exit 1
          fi
          echo "Redeploy API → $RAILWAY_SERVICE_API"
          railway redeploy --service "$RAILWAY_SERVICE_API" --yes
