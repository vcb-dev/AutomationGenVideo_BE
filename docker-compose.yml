version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: video_production_db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: video_production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.7
    container_name: video_production_meilisearch
    ports:
      - "7700:7700"
    environment:
      - MEILI_MASTER_KEY=masterKey
    volumes:
      - meilisearch_data:/meili_data
    restart: always

  redis:
    image: redis:alpine
    container_name: video_production_redis
    ports:
      - "6379:6379"
    restart: always

volumes:
  postgres_data:
  meilisearch_data:
